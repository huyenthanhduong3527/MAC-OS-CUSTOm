<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ca7f8"/>
      <stop offset="50%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#005ecb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#002b66" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- macOS App Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>

  <!-- AirDrop Concentric Arcs -->
  <!-- Center is at (256, 275) with bottom wedge opening of 90 degrees (from 135 deg to 405 deg / 45 deg) -->
  <g filter="url(#glow)" stroke="#ffffff" fill="none" stroke-linecap="round">
    <!-- Center Dot -->
    <circle cx="256" cy="275" r="18" fill="#ffffff" stroke="none"/>
    
    <!-- Ring 1 (r = 55) -->
    <!-- Arc from 135 to 405 deg (or -225 to 45 deg) -> bottom cutout -->
    <path d="M 217.1 313.9 A 55 55 0 1 1 294.9 313.9" stroke-width="16"/>

    <!-- Ring 2 (r = 100) -->
    <path d="M 185.3 345.7 A 100 100 0 1 1 326.7 345.7" stroke-width="17"/>

    <!-- Ring 3 (r = 145) -->
    <path d="M 153.5 377.5 A 145 145 0 1 1 358.5 377.5" stroke-width="18"/>
  </g>
</svg>
